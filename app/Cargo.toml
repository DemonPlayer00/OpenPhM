[package]
name = "opm-app"
version = "0.2.0"
edition = "2021"
authors = ["DemonPlayer"]
license = "GPL-3.0-or-later"
repository = "https://github.com/DemonPlayer00/OpenPhM"
description = "OpenPhM 制谱器 —— Phigros 谱面编辑器（Linux 优先；opm 原生格式 + 自研 RPE 编解码）"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`：**必须开**。默认的浮点解析偶尔会差 1 ULP（实测：谱面 79619 的
# `"chartTime": 128027.70309200211` 读进来变成 f64 …332 而不是 …331，写回去成了
# `128027.70309200212`）—— 一个"原样写回"的编辑器不能有这种漂移。
serde_json = { version = "1", features = ["float_roundtrip"] }
png = "0.18"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
cpal = "0.18"
symphonia = { version = "0.6.1", features = ["mp3", "ogg", "flac", "aac", "isomp4", "alac", "pcm", "adpcm", "mp1", "mp2", "vorbis"] }

[lib]
name = "opm_app"
path = "src/lib.rs"

[[bin]]
name = "opm-app"
path = "src/main.rs"

[[bin]]
name = "opm-ctl"
path = "src/bin/opm_ctl.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
