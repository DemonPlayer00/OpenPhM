[package]
name = "opm-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "OpenPhM 制谱器 — UI 骨架（Linux 优先）"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
cpal = "0.18"
symphonia = { version = "0.6.1", features = ["mp3", "ogg", "flac", "aac", "isomp4", "alac", "pcm", "adpcm", "mp1", "mp2", "vorbis"] }

[lib]
name = "opm_app"
path = "src/lib.rs"

[[bin]]
name = "opm-app"
path = "src/main.rs"

[[bin]]
name = "opm-ctl"
path = "src/bin/opm_ctl.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
