[package]
name = "opm-app"
version = "0.3.0"
edition = "2021"
authors = ["DemonPlayer"]
license = "GPL-3.0-or-later"
repository = "https://github.com/DemonPlayer00/OpenPhM"
description = "OpenPhM 制谱器 —— Phigros 谱面编辑器（Linux 优先；opm 原生格式 + 自研 RPE 编解码）"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`：**必须开**。默认的浮点解析偶尔会差 1 ULP（实测：谱面 79619 的
# `"chartTime": 128027.70309200211` 读进来变成 f64 …332 而不是 …331，写回去成了
# `128027.70309200212`）—— 一个"原样写回"的编辑器不能有这种漂移。
serde_json = { version = "1", features = ["float_roundtrip"] }
png = "0.18"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
cpal = "0.18"
symphonia = { version = "0.6.1", features = ["mp3", "ogg", "flac", "aac", "isomp4", "alac", "pcm", "adpcm", "mp1", "mp2", "vorbis"] }

# —— 仅 Windows 目标（Linux 构建连编译都不编译这两个）——
#
# `rfd`：Windows 上的系统文件对话框 —— **Explorer 那个框**（COM `IFileOpenDialog`/`IFileSaveDialog`）。
# Linux 侧刻意不用它（那边走 kdialog/zenity，理由见 `filedialog.rs` 开头），所以按 target 门控。
# `default-features = false` 关掉的是 `xdg-portal`/`wayland` 这两个 **Linux 专用**后端；
# `common-controls-v6` 让对话框用现代外观（comctl32 v6 清单，不开会退回旧样式）。
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }

# `windows-sys`：控制通道的命名管道（`CreateNamedPipeW` 那一套，见 `control.rs`）。
# 版本与依赖树里已有的那份（0.61.2）对齐，不额外拉第二个版本进树。
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
]

[lib]
name = "opm_app"
path = "src/lib.rs"

[[bin]]
name = "opm-app"
path = "src/main.rs"

[[bin]]
name = "opm-ctl"
path = "src/bin/opm_ctl.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
